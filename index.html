<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trust Insurance Services | Seguros en Florida</title>
  <meta name="description" content="Agencia de seguros en Florida. Comparamos más de 100 opciones para auto, hogar, salud y negocio. Cotiza gratis en minutos.">
  <meta name="theme-color" content="#001d3d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="Trust Insurance Services">
          <svg viewBox="0 0 220 56" aria-hidden="true"><path d="M26 3 4 11v16c0 13 9 22 22 26 13-4 22-13 22-26V11L26 3Z" fill="#f65a13"/><path d="m15 27 8 8 14-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="30" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="1" fill="currentColor">TRUST</text><text x="59" y="46" font-family="Montserrat, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="3.2" fill="#f65a13">INSURANCE</text></svg>
        </a>
        <nav class="nav" id="nav" aria-label="Principal">
          <a href="#top" data-i18n="nav.home"></a>
          <a href="#about" data-i18n="nav.about"></a>
          <a href="#services" data-i18n="nav.services"></a>
          <a href="#faq" data-i18n="nav.faq"></a>
          <a href="#contact" data-i18n="nav.contact"></a>
        </nav>
        <div class="header-actions">
          <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Cambiar idioma / Change language">EN</button>
          <a class="btn btn-sm" href="#contact" data-i18n="nav.quote"></a>
          <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu">☰</button>
        </div>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container">
        <h1 data-i18n="hero.title"></h1>
        <p data-i18n="hero.subtitle"></p>
        <div class="hero-actions">
          <a class="btn" href="#contact" data-i18n="hero.cta"></a>
          <a class="btn btn-ghost" href="tel:+13054190338" data-i18n="hero.advisor"></a>
        </div>
      </div>
    </section>

    <section id="about" class="section">
      <div class="container narrow">
        <p class="eyebrow" data-i18n="about.eyebrow"></p>
        <h2 data-i18n="about.title"></h2>
        <p class="lead" data-i18n="about.text"></p>
      </div>
    </section>

    <section class="section section-dark">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-i18n="why.eyebrow"></p>
          <h2 data-i18n="why.title"></h2>
        </div>
        <div class="pillars">
          <div class="pillar"><span class="num">01</span><h3 data-i18n="why.1.title"></h3><p data-i18n="why.1.text"></p></div>
          <div class="pillar"><span class="num">02</span><h3 data-i18n="why.2.title"></h3><p data-i18n="why.2.text"></p></div>
          <div class="pillar"><span class="num">03</span><h3 data-i18n="why.3.title"></h3><p data-i18n="why.3.text"></p></div>
          <div class="pillar"><span class="num">04</span><h3 data-i18n="why.4.title"></h3><p data-i18n="why.4.text"></p></div>
        </div>
      </div>
    </section>

    <section id="services" class="section">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-i18n="services.eyebrow"></p>
          <h2 data-i18n="services.title"></h2>
          <p class="lead" data-i18n="services.text"></p>
        </div>
        <div class="cards">
          <article class="card"><span class="num">01</span><h3 data-i18n="services.auto.title"></h3><p class="tag" data-i18n="services.auto.tag"></p>
            <ul><li data-i18n="services.auto.1"></li><li data-i18n="services.auto.2"></li><li data-i18n="services.auto.3"></li></ul></article>
          <article class="card"><span class="num">02</span><h3 data-i18n="services.home.title"></h3><p class="tag" data-i18n="services.home.tag"></p>
            <ul><li data-i18n="services.home.1"></li><li data-i18n="services.home.2"></li><li data-i18n="services.home.3"></li></ul></article>
          <article class="card"><span class="num">03</span><h3 data-i18n="services.business.title"></h3><p class="tag" data-i18n="services.business.tag"></p>
            <ul><li data-i18n="services.business.1"></li><li data-i18n="services.business.2"></li><li data-i18n="services.business.3"></li></ul></article>
          <article class="card"><span class="num">04</span><h3 data-i18n="services.health.title"></h3><p class="tag" data-i18n="services.health.tag"></p>
            <ul><li data-i18n="services.health.1"></li><li data-i18n="services.health.2"></li><li data-i18n="services.health.3"></li></ul></article>
        </div>
      </div>
    </section>

    <section class="section section-dark">
      <div class="container">
        <div class="stats">
          <div class="stat"><strong>&lt; 5 min</strong><span data-i18n="stats.1"></span></div>
          <div class="stat"><strong>100+</strong><span data-i18n="stats.2"></span></div>
          <div class="stat"><strong>100%</strong><span data-i18n="stats.3"></span></div>
        </div>
      </div>
    </section>

    <section id="faq" class="section faq">
      <div class="container narrow">
        <h2 data-i18n="faq.title"></h2>
        <details><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>
        <details><summary data-i18n="faq.2.q"></summary><p data-i18n="faq.2.a"></p></details>
        <details><summary data-i18n="faq.3.q"></summary><p data-i18n="faq.3.a"></p></details>
      </div>
    </section>

    <section id="contact" class="section section-dark">
      <div class="container contact-grid">
        <div class="contact-info">
          <p class="eyebrow" data-i18n="contact.eyebrow"></p>
          <h2 data-i18n="contact.title"></h2>
          <p class="lead" data-i18n="contact.text"></p>
          <dl>
            <dt data-i18n="contact.phoneLabel"></dt><dd><a href="tel:+13054190338">(305) 419-0338</a></dd>
            <dt>EMAIL</dt><dd><a href="mailto:hello@trustinsuranceservices.com">hello@trustinsuranceservices.com</a></dd>
            <dt data-i18n="contact.addressLabel"></dt><dd>10505 NW 112th Ave Ste 11,<br>Miami, FL 33178</dd>
          </dl>
        </div>
        <form class="form" id="contact-form" novalidate>
          <label><span data-i18n="contact.name"></span><input name="name" type="text" required autocomplete="name"></label>
          <label><span data-i18n="contact.email"></span><input name="email" type="email" required autocomplete="email"></label>
          <label><span data-i18n="contact.phone"></span><input name="phone" type="tel" autocomplete="tel"></label>
          <label><span data-i18n="contact.type"></span>
            <select name="type">
              <option value="auto" data-i18n="services.auto.title"></option>
              <option value="home" data-i18n="services.home.title"></option>
              <option value="business" data-i18n="services.business.title"></option>
              <option value="health" data-i18n="services.health.title"></option>
            </select>
          </label>
          <label><span data-i18n="contact.message"></span><textarea name="message" rows="3"></textarea></label>
          <button class="btn" type="submit" data-i18n="contact.send"></button>
          <p class="form-status" id="form-status" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand" href="#top" aria-label="Trust Insurance Services">
        <svg viewBox="0 0 220 56" aria-hidden="true"><path d="M26 3 4 11v16c0 13 9 22 22 26 13-4 22-13 22-26V11L26 3Z" fill="#f65a13"/><path d="m15 27 8 8 14-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="30" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="1" fill="currentColor">TRUST</text><text x="59" y="46" font-family="Montserrat, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="3.2" fill="#f65a13">INSURANCE</text></svg>
      </a>
      <p>
        <a href="https://www.facebook.com/trustinsuranceserv" rel="noopener">Facebook</a> ·
        <a href="https://www.instagram.com/trustinsuranceserv/" rel="noopener">Instagram</a>
      </p>
      <p>© <span id="year"></span> Trust Insurance Services. <span data-i18n="footer.rights"></span></p>
    </div>
  </footer>

  <a class="wa-float" href="tel:+13054190338" aria-label="Contacto / Contact">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/></svg>
  </a>
</body>
</html>
